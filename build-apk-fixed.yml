
name: Build Rushd Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Rushd APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # فك ضغط المشروع
      - name: Extract Project ZIP
        run: |
          if [ ! -f "Rushd_Project.zip" ]; then
            echo "ERROR: Rushd_Project.zip not found"
            exit 1
          fi

          mkdir -p extracted_project
          unzip -q Rushd_Project.zip -d extracted_project

          echo "Project extracted successfully"

      # البحث عن تطبيق Flutter
      - name: Find Flutter Application
        shell: bash
        run: |
          PUBSPEC=$(find extracted_project \
            -type f -name pubspec.yaml \
            -not -path '*/.dart_tool/*' \
            -not -path '*/build/*' | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: Flutter application not found"
            find extracted_project -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Found: $PROJECT_DIR"
          echo "FLUTTER_PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # تجهيز Android
      - name: Prepare Android
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      # تحميل المكتبات
      - name: Install Dependencies
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
        run: flutter pub get

      # بناء APK
      - name: Build Release APK
        working-directory: ${{ env.FLUTTER_PROJECT_DIR }}
        run: flutter build apk --release

      # حفظ التطبيق
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rushd-Android-APK
          path: ${{ env.FLUTTER_PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
