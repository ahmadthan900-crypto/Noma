name: Build Rushd APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        working-directory: Rushd_Project/mobile/rushd_flutter
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Install dependencies
        working-directory: Rushd_Project/mobile/rushd_flutter
        run: flutter pub get

      - name: Build release APK
        working-directory: Rushd_Project/mobile/rushd_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rushd-APK
          path: Rushd_Project/mobile/rushd_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
