
name: Build Rushd APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # فك ضغط المشروع
      - name: Extract Rushd Project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          unzip -o Rushd_Project.zip -d extracted

          echo "Project extracted!"
          ls -la extracted/Rushd_Project/mobile/rushd_flutter

      # التأكد من وجود كود التطبيق
      - name: Check Flutter Files
        run: |
          test -f extracted/Rushd_Project/mobile/rushd_flutter/pubspec.yaml
          test -f extracted/Rushd_Project/mobile/rushd_flutter/lib/main.dart
          echo "Flutter files found successfully!"

      # تجهيز Android
      - name: Prepare Android
        working-directory: extracted/Rushd_Project/mobile/rushd_flutter
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      # تحميل المكتبات
      - name: Install Dependencies
        working-directory: extracted/Rushd_Project/mobile/rushd_flutter
        run: flutter pub get

      # بناء التطبيق
      - name: Build APK
        working-directory: extracted/Rushd_Project/mobile/rushd_flutter
        run: flutter build apk --release

      # رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rushd-APK
          path: extracted/Rushd_Project/mobile/rushd_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
